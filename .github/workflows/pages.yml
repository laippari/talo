# Julkaisee sivun GitHub Pagesiin jokaisella main-haaran pushilla.
# Sivu on staattinen (ei käännösvaihetta): julkaistaan index.html, src/, data/, assets/ ja vanha/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check page
        run: |
          test -s index.html || { echo "index.html puuttuu"; exit 1; }
          test -s src/main.js || { echo "src/main.js puuttuu"; exit 1; }
          python3 -c "import json; json.load(open('data/site.json', encoding='utf-8'))" || { echo "data/site.json ei ole kelvollista JSONia"; exit 1; }
      - name: Check script syntax
        run: |
          # sovellus on tavallinen skripti, käynnistys ja tehosteet ES-moduuleja
          node --check src/main.js || { echo "syntaksivirhe: src/main.js"; exit 1; }
          for f in src/boot.js src/fx.js; do node --input-type=module --check < "$f" || { echo "syntaksivirhe: $f"; exit 1; }; done
          node --check vanha/main.js || { echo "syntaksivirhe: vanha/main.js"; exit 1; }
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          # versioleima: skriptit ja data haetaan leimalla, joten uusi sivu ei koskaan aja välimuistin vanhaa koodia;
          # sama leima näkyy Tekninen-välilehden alareunassa
          V=${GITHUB_SHA::7}; B=$(TZ=Europe/Helsinki date +'%-d.%-m.%Y klo %H.%M')
          sed -i "s/__VERSION__/$V/g; s/__BUILD__/$B/g" _site/index.html
          grep -q "boot.js?v=$V" _site/index.html || { echo "versioleima puuttuu"; exit 1; }
          cp -r src data assets vanha _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
