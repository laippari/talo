# Julkaisee sivun GitHub Pagesiin jokaisella main-haaran pushilla.
# Sivu on staattinen (ei käännösvaihetta): julkaistaan index.html, src/, data/, assets/ ja next/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check page
        run: |
          test -s index.html || { echo "index.html puuttuu"; exit 1; }
          test -s src/main.js || { echo "src/main.js puuttuu"; exit 1; }
          python3 -c "import json; json.load(open('data/site.json', encoding='utf-8'))" || { echo "data/site.json ei ole kelvollista JSONia"; exit 1; }
      - name: Check script syntax
        run: |
          node --check src/main.js || { echo "syntaksivirhe: src/main.js"; exit 1; }
          # uusi moottori (next/) on ES-moduuleja
          if [ -d next ]; then for f in $(find next -name '*.js'); do node --input-type=module --check < "$f" || { echo "syntaksivirhe: $f"; exit 1; }; done; fi
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src data assets _site/
          if [ -d next ]; then cp -r next _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
